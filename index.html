<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constellations of the Present</title>
  </head>
  <body>
    <div id="app">
      <canvas
        id="sky"
        role="img"
        aria-label="Cielo condiviso di stelle dei momenti presenti. Ogni stella è il codice anonimo di un momento vissuto da chi osserva in tempo reale."
      ></canvas>
      <video id="cam" autoplay muted playsinline aria-label="Anteprima della fotocamera, specchiata"></video>
      <div id="status"><span id="conn"></span> Caricamento cielo…</div>
      <div id="presence"></div>
      <div id="code" aria-live="polite"><span id="code"></span></div>
      <button id="sound-toggle" type="button" hidden>Attiva suono ambientale</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

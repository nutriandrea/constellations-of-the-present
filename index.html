<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A shared sky built from anonymous moment-hashes. Every visitor becomes a star — nothing raw ever leaves the device."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&family=Work+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>Constellations of the Present</title>
  </head>
  <body>
    <div id="app">
      <canvas
        id="sky"
        role="img"
        aria-label="A shared sky of present-moment stars. Each star is the anonymous code of a moment lived by someone watching in real time."
      ></canvas>
      <video id="cam" autoplay muted playsinline aria-label="Camera preview, mirrored"></video>

      <span class="reg reg-tl" aria-hidden="true"></span>
      <span class="reg reg-tr" aria-hidden="true"></span>
      <span class="reg reg-bl" aria-hidden="true"></span>
      <span class="reg reg-br" aria-hidden="true"></span>

      <div id="status-bar">
        <span id="conn" aria-hidden="true"></span>
        <span id="status">Loading sky…</span>
      </div>
      <div id="presence"></div>

      <header id="masthead">
        <h1>Constellations<em>of the Present</em></h1>
        <p>Observatory · on-device sensing · no capture</p>
      </header>

      <div id="code" aria-live="polite"><span id="code-value"></span></div>
      <div id="edge-caption" aria-hidden="true">Andrea Cacioppo — MMXXVI</div>

      <a id="about-link" href="/portfolio.html" aria-label="About this project">Index</a>
      <button id="sound-toggle" type="button" hidden>Enable ambient sound</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

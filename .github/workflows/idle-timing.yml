name: idle-timing
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/isea2026-constellations
      - run: |
          sed -i 's/IDLE_AFTER_MS = 4_000/IDLE_AFTER_MS = 1_000/' src/main.ts
          grep -n "IDLE_AFTER_MS =" src/main.ts
          rm -f .github/workflows/idle-timing.yml
          git config user.name "lovable-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -am "feat: interface dissolves after 1s"
          git push
